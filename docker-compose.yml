version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: safesite_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safesite
      POSTGRES_PASSWORD: safesite_pass
      POSTGRES_DB: safesite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesite -d safesite_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safesite_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://safesite:safesite_pass@db:5432/safesite_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/violation_frames:/app/violation_frames
      - ./backend/reports:/app/reports
      - ./backend/weights:/app/weights
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
